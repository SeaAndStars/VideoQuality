# Release pipeline. The only trigger is a version tag: day-to-day work lands on `dev`, `dev` is merged
# into `main`, and a GPG-signed tag on `main` builds, tests, packages and publishes both releases.
#
#   git switch main && git merge --ff-only dev
#   git tag -s v0.2.0 -m "VideoQuality 0.2.0"
#   git push origin main v0.2.0
#
# Trust anchors live outside the repository, because a tag runs the workflow *from the tagged
# commit*: anything in the repo (a key file, a pinned fingerprint, this file) can be rewritten by
# whoever pushes that commit. So:
#   - the signer's public key is fetched from the owner's GitHub account (github.com/<owner>.gpg),
#   - the expected fingerprint is the repository variable RELEASE_KEY_FINGERPRINT (admin-only),
#   - publishing runs in the `release` environment, which requires the owner's approval and only
#     accepts v* tags, and repository rulesets restrict who can update main and create v* tags.
# Third-party actions are pinned to full commit SHAs, and the token is read-only except to publish.
name: release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_NOLOGO: "1"
  DOTNET_CLI_TELEMETRY_OPTOUT: "1"

jobs:
  verify:
    name: Verify signed tag on main
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Tag is annotated and signed by the release key
        env:
          # Set in Settings → Secrets and variables → Actions → Variables (admins only).
          RELEASE_KEY_FINGERPRINT: ${{ vars.RELEASE_KEY_FINGERPRINT }}
          OWNER: ${{ github.repository_owner }}
        run: |
          [[ "$RELEASE_KEY_FINGERPRINT" =~ ^[0-9A-F]{40}$ ]] \
            || { echo "::error::repository variable RELEASE_KEY_FINGERPRINT is missing or malformed"; exit 1; }
          tag="${GITHUB_REF_NAME}"
          # checkout may leave a lightweight ref for the triggering tag; fetch the real tag object.
          git fetch --force origin "refs/tags/$tag:refs/tags/$tag"
          [[ "$(git cat-file -t "refs/tags/$tag")" == tag ]] || { echo "::error::$tag is not an annotated tag"; exit 1; }
          # The key comes from the owner's GitHub account, not from this repository.
          curl -fsSL "https://github.com/${OWNER}.gpg" -o owner-keys.asc
          gpg --batch --import owner-keys.asc
          status=$(git verify-tag --raw "$tag" 2>&1) || { echo "$status"; echo "::error::bad or missing signature on $tag"; exit 1; }
          echo "$status" | grep -q "VALIDSIG ${RELEASE_KEY_FINGERPRINT} " \
            || { echo "$status"; echo "::error::$tag is not signed by ${RELEASE_KEY_FINGERPRINT}"; exit 1; }
          echo "signature OK"

      - name: Tagged commit is on main
        run: |
          git fetch --no-tags origin main
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main \
            || { echo "::error::${GITHUB_REF_NAME} points at a commit that is not on main"; exit 1; }

      - id: version
        name: Version from tag
        run: |
          version="${GITHUB_REF_NAME#v}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "::error::tag must look like v1.2.3"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"

  # Every test on Windows first: its coverage covers the Windows-only branches, and the Linux job
  # merges it (branch by branch) with its own runs and requires 100% line and branch coverage.
  test-windows:
    name: Test (Windows)
    needs: [verify, ffmpeg-windows]
    runs-on: windows-2025
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-win-x64
      - name: Tools (libav, the encoder ffmpeg, MKVToolNix)
        run: |
          mkdir -p "$RUNNER_TEMP/build-win" && tar -C "$RUNNER_TEMP/build-win" -xzf ffmpeg-win-x64.tar.gz
          ./scripts/fetch-ffmpeg-gpl.sh win-x64 "$RUNNER_TEMP/encoder"
          ./scripts/fetch-mkvtoolnix.sh win-x64 "$RUNNER_TEMP/mkvtoolnix"
      - name: Test with coverage
        run: |
          export FFMPEG_ROOT="$(cygpath -w "$RUNNER_TEMP/build-win/stage/ffmpeg")"
          export VQ_ENCODER_FFMPEG="$(cygpath -w "$RUNNER_TEMP/encoder/ffmpeg.exe")"
          export PATH="$RUNNER_TEMP/mkvtoolnix:$PATH"
          dotnet test VideoQuality.Tests -c Debug /p:CollectCoverage=true /p:CoverletOutputFormat=json \
            "/p:CoverletOutput=$(cygpath -w "$PWD/artifacts/coverage")\\" \
            '/p:Include=[VideoQuality.Core]*%2c[VideoQuality.App]*%2c[VideoQuality.Cli]*' \
            '/p:ExcludeByAttribute=GeneratedCodeAttribute%2cCompilerGeneratedAttribute'
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-windows
          path: artifacts/coverage/coverage.json
          retention-days: 3

  test:
    name: Test (Linux) and require 100% coverage
    needs: [verify, ffmpeg-linux, test-windows]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-linux-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-windows
          path: coverage-windows
      - name: Tools (libav, the encoder ffmpeg, MKVToolNix)
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends mkvtoolnix
          mkdir -p ~/build-linux && tar -C ~/build-linux -xzf ffmpeg-linux-x64.tar.gz
          ./scripts/fetch-ffmpeg-gpl.sh linux-x64 "$RUNNER_TEMP/encoder"
          dotnet tool restore
      - name: Test, merge with Windows, require 100%
        env:
          FFMPEG_ROOT: /home/runner/build-linux/stage/ffmpeg
        run: VQ_ENCODER_FFMPEG="$RUNNER_TEMP/encoder/ffmpeg" ./scripts/coverage.sh coverage-windows/coverage.json
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: coverage-report
          path: artifacts/coverage/report
          retention-days: 14

  ffmpeg-windows:
    name: FFmpeg + libvmaf CUDA (Windows)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/build-win/stage
          key: ffmpeg-win-x64-${{ hashFiles('scripts/build-ffmpeg-windows.sh') }}

      - name: Toolchain (mingw-w64, clang, CUDA nvcc)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64-posix g++-mingw-w64-x86-64-posix mingw-w64-tools \
            nasm meson ninja-build clang pkg-config xxd
          wget -q https://developer.download.nvidia.com/compute/cuda/repos/ubuntu2404/x86_64/cuda-keyring_1.1-1_all.deb
          sudo dpkg -i cuda-keyring_1.1-1_all.deb
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends cuda-nvcc-12-8 cuda-cudart-dev-12-8

      - name: Build
        if: steps.cache.outputs.cache-hit != 'true'
        env:
          CUDA_HOME: /usr/local/cuda-12.8
        run: ./scripts/build-ffmpeg-windows.sh

      # A tarball keeps execute bits and the soname symlinks, which artifacts would drop.
      - run: tar -C ~/build-win -czf ffmpeg-win-x64.tar.gz stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-win-x64
          path: ffmpeg-win-x64.tar.gz
          retention-days: 3

  ffmpeg-linux:
    name: FFmpeg + libvmaf CUDA (Linux, glibc 2.35)
    needs: verify
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - id: cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/build-linux/stage
          key: ffmpeg-linux-x64-${{ hashFiles('scripts/build-ffmpeg-linux.sh', 'scripts/build-ffmpeg-linux-docker.sh', 'scripts/linux-build.Dockerfile') }}

      - name: Build in ubuntu:22.04
        if: steps.cache.outputs.cache-hit != 'true'
        run: ./scripts/build-ffmpeg-linux-docker.sh

      # A tarball keeps execute bits and the soname symlinks, which artifacts would drop.
      - run: tar -C ~/build-linux -czf ffmpeg-linux-x64.tar.gz stage
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ffmpeg-linux-x64
          path: ffmpeg-linux-x64.tar.gz
          retention-days: 3

  release:
    name: Package and publish
    needs: [verify, test, test-windows, ffmpeg-windows, ffmpeg-linux]
    runs-on: ubuntu-24.04
    # Required reviewer (the owner) and a v* tag policy are configured on the environment in the
    # repository settings; the job waits for approval before it gets a write token.
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-win-x64
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ffmpeg-linux-x64

      - name: Package
        env:
          VQ_VERSION: ${{ needs.verify.outputs.version }}
        run: |
          sudo apt-get update && sudo apt-get install -y --no-install-recommends librsvg2-bin zip patchelf squashfs-tools
          mkdir -p ~/build-win ~/build-linux
          tar -C ~/build-win -xzf ffmpeg-win-x64.tar.gz
          tar -C ~/build-linux -xzf ffmpeg-linux-x64.tar.gz
          ./scripts/package.sh win-x64
          ./scripts/package.sh linux-x64
          # GPL-2.0 corresponding source for the bundled MKVToolNix binaries.
          ./scripts/fetch-mkvtoolnix.sh source artifacts/mkvtoolnix-source
          mv artifacts/mkvtoolnix-source/mkvtoolnix-*.tar.xz artifacts/
          # GPL-3.0 corresponding source for the bundled encoder ffmpeg.
          ./scripts/fetch-ffmpeg-gpl.sh source artifacts/ffmpeg-gpl-source
          mv artifacts/ffmpeg-gpl-source/ffmpeg-*.tar.gz artifacts/
          cd artifacts
          sha256sum VideoQuality-*.zip VideoQuality-*.tar.gz mkvtoolnix-*.tar.xz ffmpeg-*.tar.gz > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --title "VideoQuality ${{ needs.verify.outputs.version }}" \
            --verify-tag --generate-notes \
            artifacts/VideoQuality-*.zip artifacts/VideoQuality-*.tar.gz artifacts/mkvtoolnix-*.tar.xz artifacts/ffmpeg-*.tar.gz artifacts/SHA256SUMS.txt
